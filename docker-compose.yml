version: '3.8'

services:
  database:
    image: mongo:6.0
    container_name: careerpilot-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: careerpilot-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/careerpilot
      - JWT_ACCESS_SECRET=supersecureaccesssecret123!
      - JWT_REFRESH_SECRET=supersecurerefreshsecret123!
      - GEMINI_API_KEY=DEVELOPER_KEY_KEY
    depends_on:
      - database

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: careerpilot-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
